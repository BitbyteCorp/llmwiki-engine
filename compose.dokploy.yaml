# Dokploy "Docker Compose" 서비스 전용 파일이다. 설정 절차와 이유는 docs/dokploy.md에 기록한다.
services:
  llmwiki:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: 3000
      DEV_LOGIN_EMAIL: ""
      TRUST_PROXY: "true"
    expose:
      - "3000"
    volumes:
      - llmwiki-data:/data
      - ../files:/run/secrets/llmwiki:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  llmwiki-data:
